name: lint

on:
  pull_request:
  push:
    branches:
      - "main"

jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_names: >-
            .profile
            .zshrc
            .git-prompt.sh
            .git-completion.bash
